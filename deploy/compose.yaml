name: referflow-production

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${PGDATABASE:-referflow}
      POSTGRES_USER: ${PGUSER:-referflow}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  api:
    image: ghcr.io/azamatbayramov/referflow-api:${IMAGE_TAG:?Set IMAGE_TAG in .env.production}
    restart: unless-stopped
    logging: *logging
    environment:
      HTTP_ADDR: :8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_ORIGINS: https://${SITE_ADDRESS:?Set SITE_ADDRESS in .env.production}
      SESSION_COOKIE_SECURE: "true"
      SESSION_TTL: ${SESSION_TTL:-12h}
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${PGDATABASE:-referflow}
      PGUSER: ${PGUSER:-referflow}
      PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env.production}
      PGSSLMODE: disable
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    stop_grace_period: 15s

  web:
    image: ghcr.io/azamatbayramov/referflow-web:${IMAGE_TAG:?Set IMAGE_TAG in .env.production}
    restart: unless-stopped
    logging: *logging
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
