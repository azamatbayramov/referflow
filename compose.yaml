name: ${COMPOSE_PROJECT_NAME:-referflow}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${PGDATABASE:-referflow}
      POSTGRES_USER: ${PGUSER:-referflow}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Run make init first}
    ports:
      - "127.0.0.1:${PGPORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  api:
    build: ./backend
    environment:
      HTTP_ADDR: :8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_ORIGINS: ${APP_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_TTL: ${SESSION_TTL:-12h}
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${PGDATABASE:-referflow}
      PGUSER: ${PGUSER:-referflow}
      PGPASSWORD: ${PGPASSWORD:?Run make init first}
      PGSSLMODE: disable
    ports:
      - "127.0.0.1:${API_PORT:-8081}:8080"
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    stop_grace_period: 15s

  web:
    build: ./frontend
    environment:
      SITE_ADDRESS: :8080
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
