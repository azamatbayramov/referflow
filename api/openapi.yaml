openapi: 3.1.0
info:
  title: Referflow infrastructure API
  version: 0.1.0
  description: Infrastructure endpoints only. No business API is implemented.
servers:
  - url: /
paths:
  /api/healthz:
    get:
      operationId: getLiveness
      summary: Check whether the API process is alive
      description: Does not query PostgreSQL. HEAD is also supported, without a body.
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
  /api/readyz:
    get:
      operationId: getReadiness
      summary: Check PostgreSQL connectivity
      description: Pings PostgreSQL with a two-second deadline. HEAD is also supported.
      responses:
        '200':
          description: PostgreSQL is reachable
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    const: ready
        '503':
          description: PostgreSQL is unavailable or the request timed out
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    const: unavailable
