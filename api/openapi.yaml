openapi: 3.1.0
info:
  title: Referflow API
  version: 0.6.0
  description: Specialist sessions, client cards, coupons and audited uses/cancellations. Public read-only QR cards are available.
servers:
  - url: /
paths:
  /api/healthz:
    get:
      operationId: getLiveness
      summary: Check whether the API process is alive
      description: Does not query PostgreSQL. HEAD is also supported, without a body.
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
  /api/readyz:
    get:
      operationId: getReadiness
      summary: Check PostgreSQL and applied schema
      description: Verifies migration checksums with a two-second deadline. HEAD is also supported.
      responses:
        '200':
          description: PostgreSQL and the required schema are ready
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    const: ready
        '503':
          description: PostgreSQL is unavailable or the request timed out
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    const: unavailable
  /api/auth/login:
    post:
      operationId: login
      summary: Start a specialist session
      description: |
        Requires an exact configured Origin and JSON body. Login rotates a supplied
        session cookie. All attempts share an account budget of 10 per 15 minutes
        and an application budget of 120 per minute. No account registration API exists.
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [login, password]
              properties:
                login:
                  type: string
                  minLength: 1
                  maxLength: 254
                  description: Case-insensitive login, trimmed at the edges. No internal whitespace, control or Unicode format characters. An email address is not required.
                password:
                  type: string
                  format: password
                  writeOnly: true
                  description: Account passwords contain 8–128 Unicode characters. Login input is bounded to 512 UTF-8 bytes.
      responses:
        '200':
          description: Session created; token is sent only in an HttpOnly cookie
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Secure __Host-referflow_session cookie in production; referflow_session for explicit loopback HTTP development. Path=/, HttpOnly, SameSite=Strict, no Domain.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/CSRF'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          description: Login budget exhausted; Retry-After is a conservative maximum wait
          headers:
            Retry-After:
              schema:
                type: integer
                const: 900
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/auth/session:
    get:
      operationId: getSession
      summary: Get the authenticated specialist and a CSRF token
      description: |
        Resolves the owner solely from the session cookie and database, never from
        a caller-supplied specialist ID. Checks absolute expiry on every request.
        Responses are no-store. There are no CORS grants.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Authenticated specialist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/auth/logout:
    post:
      operationId: logout
      summary: Revoke this session and clear its cookie
      description: The old cookie cannot authenticate after logout. A failed database request does not clear the cookie or claim successful logout.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
          description: csrf_token returned by login or getSession
      responses:
        '204':
          description: Session revoked and cookie cleared
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CSRF'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/clients:
    post:
      operationId: createClient
      summary: Create an owner-scoped client card
      description: Repeating the same UUID key and normalized payload returns the same card in its current state, including
        edits/archive. A different payload with that key returns 409. The key is scoped to the specialist and retained with
        the card. Shared phones are allowed.
      security:
      - sessionCookie: []
      parameters:
      - &id001
        $ref: '#/components/parameters/Origin'
      - &id002
        name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - name
              properties:
                name: &id013
                  type: string
                  minLength: 1
                  maxLength: 120
                phone: &id014
                  type: string
                  maxLength: 40
                  default: ''
                  description: 'Optional. When nonempty: 7–15 digits with initial +, spaces, parentheses or hyphens.'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '200':
          description: Idempotent replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '400': &id003
          $ref: '#/components/responses/BadRequest'
        '401': &id004
          $ref: '#/components/responses/Unauthenticated'
        '403': &id005
          $ref: '#/components/responses/CSRF'
        '405': &id006
          $ref: '#/components/responses/MethodNotAllowed'
        '413': &id007
          $ref: '#/components/responses/TooLarge'
        '415': &id008
          $ref: '#/components/responses/UnsupportedMediaType'
        '503': &id009
          $ref: '#/components/responses/Unavailable'
        '404': &id010
          description: Card absent or owned by another specialist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '409': &id011
          description: Idempotency payload mismatch or stale client version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /api/clients/search:
    post:
      operationId: searchClients
      summary: Search own client cards
      description: Search in JSON avoids contacts in URLs. Case-insensitive name substring (е/ё equivalent) OR phone digit substring.
        Explicit phone provides a second possible match. No automatic national-prefix rewriting. At most 50 results, newest
        first; no total count.
      security:
      - sessionCookie: []
      parameters: &id012
      - *id001
      - *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                query:
                  type: string
                  maxLength: 120
                  default: ''
                phone:
                  type: string
                  maxLength: 40
                  default: ''
                state:
                  type: string
                  enum:
                  - active
                  - archived
                  - all
                  default: active
                offset:
                  type: integer
                  minimum: 0
                  maximum: 100000
                  default: 0
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - has_more
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Client'
                    maxItems: 50
                  has_more:
                    type: boolean
        '400': *id003
        '401': *id004
        '403': *id005
        '405': *id006
        '413': *id007
        '415': *id008
        '503': *id009
        '404': *id010
        '409': *id011
  /api/clients/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getClient
      summary: Read own client card and latest 50 operation events
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Card with latest events, newest version first
          content:
            application/json:
              schema:
                type: object
                required:
                - client
                - events
                properties:
                  client:
                    $ref: '#/components/schemas/Client'
                  events:
                    type: array
                    maxItems: 50
                    items:
                      $ref: '#/components/schemas/ClientEvent'
        '401': *id004
        '405': *id006
        '503': *id009
        '404': *id010
    put:
      operationId: updateClient
      summary: Correct contacts or archive/restore a card without changing its ID
      description: Requires the current version; a stale version returns 409. Changes and an operation event commit atomically.
        Identical values make no new event. Cards cannot be deleted.
      security:
      - sessionCookie: []
      parameters: *id012
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - name
              - phone
              - archived
              - version
              properties:
                name: *id013
                phone: *id014
                archived:
                  type: boolean
                version:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Updated card
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '400': *id003
        '401': *id004
        '403': *id005
        '405': *id006
        '413': *id007
        '415': *id008
        '503': *id009
        '404': *id010
        '409': *id011
  /api/coupons:
    post:
      operationId: createCoupon
      summary: Issue a standalone coupon with immutable terms
      description: Owner comes only from the session. UUIDv4 identifies the coupon and will back a future public QR page; no
        public endpoint is implemented in this phase. Replay returns the same coupon in its current state and cannot revive
        it. Issuance and its event commit atomically.
      security:
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/Origin'
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - discount_type
              - value
              properties:
                discount_type:
                  type: string
                  enum:
                  - percent
                  - fixed
                value:
                  type: string
                  pattern: ^[0-9]{1,10}([.,][0-9]{1,2})?$
                  description: 'Exact decimal, no floats/exponents. Percent: 0.01–100.00; fixed RUB: 0.01–9999999999.99. Comma
                    or period input; dot with two digits in responses.'
                restrictions:
                  type: string
                  maxLength: 2000
                  default: ''
                  description: Optional plain text; line breaks are preserved and never silently truncated.
                total_limit:
                  type:
                  - integer
                  - 'null'
                  minimum: 1
                  maximum: 2147483647
                  default: null
                per_client_limit:
                  type:
                  - integer
                  - 'null'
                  minimum: 1
                  maximum: 2147483647
                  default: 1
                  description: Omitted defaults to 1. Explicit null means unlimited, independently of total_limit.
                first_visit_only:
                  type: boolean
                  default: false
                expires_on:
                  type:
                  - string
                  - 'null'
                  format: date
                  default: null
                  description: Last valid date inclusive at fixed Moscow UTC+03:00. Expiry is next day 00:00 UTC+03:00, exclusive.
                    Past dates are permitted and immediately show expired.
                referrer_client_id:
                  type:
                  - string
                  - 'null'
                  format: uuid
                  default: null
                  description: Optional own active client to whom the coupon was issued, not the discount recipient. Not an
                    eligibility restriction.
      responses:
        '201':
          description: Issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coupon'
        '200':
          description: Idempotent replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coupon'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CSRF'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503':
          $ref: '#/components/responses/Unavailable'
        '404':
          description: Coupon absent or owned by another specialist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '409':
          description: Idempotency key reused with another payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /api/coupons/search:
    post:
      operationId: searchCoupons
      summary: List own coupons or find an exact normalized paper number
      description: Searches do not consume coupon usages. Newest first, 50 records per page. Detail reads share the same per-specialist
        lookup budget.
      security:
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/Origin'
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                code:
                  type: string
                  maxLength: 20
                  default: ''
                  description: Exact number lookup. Spaces and hyphens are removed; 1–6 digits are left-padded to six. Empty lists own coupons.
                state:
                  type: string
                  enum:
                  - all
                  - available
                  - expired
                  - revoked
                  - exhausted
                  default: all
                offset:
                  type: integer
                  minimum: 0
                  maximum: 100000
                  default: 0
      responses:
        '200':
          description: Own coupons
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - has_more
                properties:
                  items:
                    type: array
                    maxItems: 50
                    items:
                      $ref: '#/components/schemas/Coupon'
                  has_more:
                    type: boolean
        '429':
          description: Shared per-specialist budget of 120 searches/detail reads per minute exhausted. No raw IP headers are
            trusted.
          headers:
            Retry-After:
              schema:
                type: integer
                const: 60
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CSRF'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/coupons/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getCoupon
      summary: Read own coupon and immutable issuance/revocation events
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Current conditions/state and audit
          content:
            application/json:
              schema:
                type: object
                required:
                - coupon
                - events
                properties:
                  coupon:
                    $ref: '#/components/schemas/Coupon'
                  events:
                    type: array
                    maxItems: 2
                    items:
                      $ref: '#/components/schemas/CouponEvent'
        '429':
          description: Shared per-specialist budget of 120 searches/detail reads per minute exhausted. No raw IP headers are
            trusted.
          headers:
            Retry-After:
              schema:
                type: integer
                const: 60
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/Unavailable'
        '404':
          description: Coupon absent or owned by another specialist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /api/coupons/{id}/revoke:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: revokeCoupon
      summary: Permanently revoke own coupon
      description: Requires a nonempty reason. Concurrent/repeated calls preserve the first reason and time, returning the same
        revoked coupon with one revocation event. No undo, deletion or term-edit endpoint exists. Number reservation is retained
        forever.
      security:
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/Origin'
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - reason
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
        '200':
          description: Revoked or already revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coupon'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CSRF'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503':
          $ref: '#/components/responses/Unavailable'
        '404':
          description: Coupon absent or owned by another specialist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /api/redemptions:
    post:
      operationId: redeemCoupon
      summary: Confirm coupon use by an existing own active client
      description: Checks owner, revocation, exact expiry and total/personal active-use limits atomically under the coupon row
        lock. Captures the nominal discount and manual confirmations. The per-specialist UUID key applies across all coupons.
        Replay returns the same operation, including cancellation, even if the coupon/client later becomes unavailable. A new
        key is required for an explicit replacement. No price, visit ID or caller timestamp is accepted.
      security:
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/Origin'
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - coupon_id
              - client_id
              - single_coupon_confirmed
              properties:
                coupon_id:
                  type: string
                  format: uuid
                client_id:
                  type: string
                  format: uuid
                single_coupon_confirmed:
                  type: boolean
                  const: true
                  description: Specialist manually confirms one coupon for the actual appointment. No visit record exists.
                first_visit_confirmed:
                  type: boolean
                  default: false
                  description: Must be true when the coupon requires the first visit, including visits before Referflow. Never
                    inferred from empty client history.
      responses:
        '201':
          description: Confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Redemption'
        '200':
          description: Replay in its current state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Redemption'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CSRF'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503':
          $ref: '#/components/responses/Unavailable'
        '404':
          description: Coupon, client, operation or requested history filter absent or owned by another specialist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '409':
          description: Idempotency key already committed with another payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '422':
          description: coupon_revoked, coupon_expired, total_limit_reached, personal_limit_reached, client_archived or confirmation_required;
            no operation committed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /api/redemptions/search:
    post:
      operationId: searchRedemptions
      summary: Read coupon-use history for own client and/or coupon
      description: Requires at least one filter. Both provided filters are ANDed. Includes canceled uses and archived clients,
        newest first, 50 records per page. This is not a complete visit history or proof of the first visit.
      security:
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/Origin'
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              anyOf:
              - required:
                - coupon_id
              - required:
                - client_id
              properties:
                coupon_id:
                  type: string
                  format: uuid
                client_id:
                  type: string
                  format: uuid
                offset:
                  type: integer
                  minimum: 0
                  maximum: 100000
                  default: 0
      responses:
        '200':
          description: Own operation history
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - has_more
                properties:
                  items:
                    type: array
                    maxItems: 50
                    items:
                      $ref: '#/components/schemas/Redemption'
                  has_more:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CSRF'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503':
          $ref: '#/components/responses/Unavailable'
        '404':
          description: Coupon, client, operation or requested history filter absent or owned by another specialist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /api/redemptions/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getRedemption
      summary: Read own immutable use and its cancellation audit
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Redemption'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/Unavailable'
        '404':
          description: Coupon, client, operation or requested history filter absent or owned by another specialist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /api/redemptions/{id}/cancel:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: cancelRedemption
      summary: Cancel a mistaken use and release limits exactly once
      description: The coupon row is locked before the operation. First reason, author and time are retained on repeated/concurrent
        cancellation. Original operation and confirmations remain. Revoked/expired coupons remain unavailable; archived clients
        can still have erroneous uses canceled. No restore, delete or move endpoint exists.
      security:
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/Origin'
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - reason
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
        '200':
          description: Canceled or already canceled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Redemption'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CSRF'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503':
          $ref: '#/components/responses/Unavailable'
        '404':
          description: Coupon, client, operation or requested history filter absent or owned by another specialist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /api/public/coupons/{id}:
    get:
      operationId: getPublicCoupon
      summary: Read public terms and current overall status by UUIDv4
      description: 'No session required; ignores cookies and does not record an event, reserve or consume a use. Separate
        public DTO never includes clients, owner, referrer, login, usage count, audit, or revocation/cancellation
        reasons. UUID is a shareable read capability, not write authorization. No public short-code search. All responses
        have Cache-Control: no-store, Referrer-Policy: no-referrer and X-Robots-Tag: noindex, nofollow, noarchive.
        Database work has a two-second deadline. Overall available status does not prove individual eligibility.'
      security: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
      responses:
        '200':
          description: Public terms and status as of this read. HEAD is also supported without a body.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCoupon'
        '404':
          description: Malformed, non-v4, absent UUID or short number; same response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-referflow_session
      description: The loopback-only HTTP development cookie is named referflow_session.
  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      schema:
        type: string
      description: Exact allowlisted browser origin, including scheme and port. Missing or null origins are rejected for writes.
  schemas:
    PublicCoupon:
      type: object
      additionalProperties: false
      required:
      - code
      - discount_type
      - value
      - restrictions
      - total_limit
      - per_client_limit
      - first_visit_only
      - expires_on
      - expires_at
      - status
      properties:
        code:
          type: string
          readOnly: true
          description: Server-generated six-digit number; private search only. Not globally unique.
          pattern: ^[0-9]{6}$
        discount_type:
          type: string
          enum:
          - percent
          - fixed
        value:
          type: string
          pattern: ^[0-9]{1,10}([.,][0-9]{1,2})?$
          description: 'Exact decimal, no floats/exponents. Percent: 0.01–100.00; fixed RUB: 0.01–9999999999.99. Comma
            or period input; dot with two digits in responses.'
        restrictions:
          type: string
          maxLength: 2000
          description: Optional plain text; line breaks are preserved and never silently truncated.
        total_limit:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 2147483647
        per_client_limit:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 2147483647
          description: Public coupon condition only; an anonymous viewer has no personal eligibility result.
        first_visit_only:
          type: boolean
        expires_on:
          type:
          - string
          - 'null'
          format: date
          description: Last valid date inclusive at fixed Moscow UTC+03:00. Expiry is next day 00:00 UTC+03:00, exclusive.
            Past dates are permitted and immediately show expired.
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        status:
          type: string
          enum:
          - available
          - expired
          - exhausted
          - revoked
          description: 'Precedence: revoked, expired, exhausted, available. This is global state, not client-specific
            eligibility.'
    User:
      type: object
      additionalProperties: false
      required: [id, login, name]
      properties:
        id:
          type: string
          format: uuid
        login:
          type: string
          minLength: 1
          maxLength: 254
          description: Normalized lowercase account login.
        name:
          type: string
    Session:
      type: object
      additionalProperties: false
      required: [user, expires_at, csrf_token]
      properties:
        user:
          $ref: '#/components/schemas/User'
        expires_at:
          type: string
          format: date-time
        csrf_token:
          type: string
          minLength: 43
          maxLength: 43
          description: Keep in memory; send as X-CSRF-Token on authenticated writes. This is not the session token.
    Client:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - phone
      - archived
      - version
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        phone:
          type: string
          maxLength: 40
          default: ''
          description: 'Optional. When nonempty: 7–15 digits with initial +, spaces, parentheses or hyphens.'
        archived:
          type: boolean
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ClientEvent:
      type: object
      additionalProperties: false
      required:
      - version
      - action
      - occurred_at
      properties:
        version:
          type: integer
          minimum: 1
        action:
          type: string
          enum:
          - created
          - updated
          - archived
          - restored
        occurred_at:
          type: string
          format: date-time
    Coupon:
      type: object
      additionalProperties: false
      required:
      - code
      - discount_type
      - value
      - restrictions
      - total_limit
      - per_client_limit
      - first_visit_only
      - expires_on
      - referrer_client_id
      - id
      - used_count
      - status
      - expires_at
      - referrer_name
      - revoked_at
      - revoke_reason
      - created_at
      properties:
        code:
          type: string
          readOnly: true
          description: Server-generated six-digit number, never reused for this specialist. The create API rejects a code field.
          pattern: ^[0-9]{6}$
        discount_type:
          type: string
          enum:
          - percent
          - fixed
        value:
          type: string
          pattern: ^[0-9]{1,10}([.,][0-9]{1,2})?$
          description: 'Exact decimal, no floats/exponents. Percent: 0.01–100.00; fixed RUB: 0.01–9999999999.99. Comma or period
            input; dot with two digits in responses.'
        restrictions:
          type: string
          maxLength: 2000
          description: Optional plain text; line breaks are preserved and never silently truncated.
        total_limit:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 2147483647
        per_client_limit:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 2147483647
          description: Omitted defaults to 1. Explicit null means unlimited, independently of total_limit.
        first_visit_only:
          type: boolean
        expires_on:
          type:
          - string
          - 'null'
          format: date
          description: Last valid date inclusive at fixed Moscow UTC+03:00. Expiry is next day 00:00 UTC+03:00, exclusive. Past
            dates are permitted and immediately show expired.
        referrer_client_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Optional own active client to whom the coupon was issued, not the discount recipient. Not an eligibility
            restriction.
        id:
          type: string
          format: uuid
          description: Cryptographically random UUIDv4.
        used_count:
          type: integer
          minimum: 0
          description: Number of active (not canceled) confirmed uses; lookup never changes it.
        status:
          type: string
          enum:
          - available
          - expired
          - exhausted
          - revoked
          description: 'Precedence: revoked, expired, exhausted, available. This is global state, not client-specific eligibility.'
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        referrer_name:
          type:
          - string
          - 'null'
        revoked_at:
          type:
          - string
          - 'null'
          format: date-time
        revoke_reason:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
    CouponEvent:
      type: object
      additionalProperties: false
      required:
      - action
      - reason
      - occurred_at
      properties:
        action:
          type: string
          enum:
          - created
          - revoked
        reason:
          type:
          - string
          - 'null'
        occurred_at:
          type: string
          format: date-time
    Redemption:
      type: object
      additionalProperties: false
      required:
      - id
      - coupon_id
      - client_id
      - author_id
      - coupon_code
      - client_name
      - author_name
      - discount_type
      - value
      - single_coupon_confirmed
      - first_visit_confirmed
      - first_visit_required
      - confirmed_at
      - canceled_at
      - canceled_by
      - canceled_by_name
      - cancel_reason
      properties:
        id:
          type: string
          format: uuid
        coupon_id:
          type: string
          format: uuid
        client_id:
          type: string
          format: uuid
        author_id:
          type: string
          format: uuid
        coupon_code:
          type: string
          pattern: ^[0-9]{6}$
        client_name:
          type: string
        author_name:
          type: string
        discount_type:
          type: string
          enum:
          - percent
          - fixed
        value:
          type: string
          description: Nominal discount captured at confirmation, exact decimal with two fractional digits; not a final appointment
            price.
        single_coupon_confirmed:
          type: boolean
          const: true
        first_visit_confirmed:
          type: boolean
        first_visit_required:
          type: boolean
        confirmed_at:
          type: string
          format: date-time
          description: Server wall-clock at the serialized decision, after lock waits.
        canceled_at:
          type:
          - string
          - 'null'
          format: date-time
        canceled_by:
          type:
          - string
          - 'null'
          format: uuid
        canceled_by_name:
          type:
          - string
          - 'null'
        cancel_reason:
          type:
          - string
          - 'null'
    Status:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [coupon_revoked, coupon_expired, total_limit_reached, personal_limit_reached, client_archived, confirmation_required, too_many_requests, not_found, conflict, invalid_request, invalid_credentials, unauthenticated, csrf_failed, method_not_allowed, request_too_large, unsupported_media_type, too_many_attempts, unavailable]
  responses:
    BadRequest:
      description: Malformed, extra, or invalid input fields
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Status'
    InvalidCredentials:
      description: Invalid login or password; identical for missing and existing accounts
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Status'
    Unauthenticated:
      description: Missing, ambiguous, invalid, expired, or revoked session
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Status'
    CSRF:
      description: Missing/untrusted Origin or missing/invalid CSRF header
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Status'
    MethodNotAllowed:
      description: Unsupported HTTP method; Allow header lists the supported method
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Status'
    TooLarge:
      description: Login body exceeds 4096 bytes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Status'
    UnsupportedMediaType:
      description: Login requires application/json
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Status'
    Unavailable:
      description: Storage temporarily unavailable or password-verification capacity exhausted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Status'
